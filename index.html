<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether Wallpaper</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#030308; font-family:'Cinzel',serif; color:#e0d8f0; }
    #gradient-canvas { position:fixed; inset:0; z-index:0; }
    #canvas-container { position:fixed; inset:0; z-index:1; }
    canvas { display:block; }
    #veil { position:fixed; inset:0; z-index:5; background:#000; opacity:0; pointer-events:none; transition:opacity 0.8s ease; }
    #veil.on { opacity:1; }
    #loading-bar { position:fixed; top:0; left:0; height:2px; background:linear-gradient(90deg,#00ffe7,#a855f7); width:0%; z-index:100; transition:width 0.4s ease; opacity:0; }
    #hud { position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity 1s ease; z-index:10; }
    #hud.visible { opacity:1; }
    #model-name { position:fixed; bottom:2.5rem; left:50%; transform:translateX(-50%); font-size:clamp(1rem,3vw,2rem); font-weight:700; letter-spacing:0.4em; text-transform:uppercase; background:linear-gradient(135deg,#00ffe7,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    #countdown { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%); font-family:'Cormorant Garamond',serif; font-style:italic; font-size:0.7rem; letter-spacing:0.35em; color:rgba(160,140,200,0.35); }
    .corner-deco { position:fixed; width:70px; height:70px; pointer-events:none; opacity:0.3; z-index:10; }
    .corner-deco::before,.corner-deco::after { content:''; position:absolute; background:var(--accent,#00ffe7); }
    .corner-deco::before { width:2px; height:35px; }
    .corner-deco::after { width:35px; height:2px; }
    .corner-deco.tl { top:20px; left:20px; }
    .corner-deco.tr { top:20px; right:20px; transform:scaleX(-1); }
    .corner-deco.bl { bottom:20px; left:20px; transform:scaleY(-1); }
    .corner-deco.br { bottom:20px; right:20px; transform:scale(-1); }
    #controls { position:fixed; top:1.2rem; right:1.2rem; display:flex; gap:0.5rem; z-index:20; }
    .ctrl-btn { padding:0.4rem 0.9rem; background:rgba(3,3,8,0.75); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.1); color:rgba(200,190,230,0.6); font-family:'Cinzel',serif; font-size:0.6rem; letter-spacing:0.2em; text-transform:uppercase; cursor:pointer; transition:all 0.2s; white-space:nowrap; user-select:none; }
    .ctrl-btn:hover { border-color:rgba(0,255,231,0.5); color:#00ffe7; background:rgba(0,255,231,0.06); }
    .ctrl-btn.accent { border-color:rgba(0,255,231,0.3); color:rgba(0,255,231,0.75); }
    .ctrl-btn.accent:hover { background:rgba(0,255,231,0.1); }
    .ctrl-btn.ed-tog { border-color:rgba(168,85,247,0.4); color:rgba(168,85,247,0.8); }
    .ctrl-btn.ed-tog:hover,.ctrl-btn.ed-tog.active { background:rgba(168,85,247,0.1); border-color:rgba(168,85,247,0.8); color:#a855f7; }
    #hint { position:fixed; top:1.2rem; left:1.2rem; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:0.65rem; letter-spacing:0.3em; color:rgba(160,140,200,0.2); pointer-events:none; z-index:20; }
    #error-banner { position:fixed; top:1rem; left:50%; transform:translateX(-50%); background:rgba(255,60,60,0.12); border:1px solid rgba(255,60,60,0.35); color:rgba(255,160,160,0.9); padding:0.6rem 1.4rem; font-size:0.68rem; letter-spacing:0.18em; display:none; z-index:100; max-width:90vw; text-align:center; line-height:1.6; }
    #editor { position:fixed; top:0; right:0; width:400px; height:100vh; background:rgba(4,4,14,0.97); backdrop-filter:blur(20px); border-left:1px solid rgba(168,85,247,0.2); z-index:30; display:flex; flex-direction:column; transform:translateX(100%); transition:transform 0.4s cubic-bezier(0.16,1,0.3,1); }
    #editor.open { transform:translateX(0); }
    .ed-header { padding:1rem 1.2rem 0.8rem; border-bottom:1px solid rgba(168,85,247,0.15); flex-shrink:0; }
    .ed-title { font-size:0.7rem; letter-spacing:0.35em; color:rgba(168,85,247,0.9); text-transform:uppercase; font-family:'Cinzel',serif; }
    .ed-mid { display:flex; flex:1; overflow:hidden; }
    .ed-tabs { display:flex; flex-direction:column; width:110px; flex-shrink:0; overflow-y:auto; border-right:1px solid rgba(168,85,247,0.12); padding:0.5rem 0; scrollbar-width:thin; scrollbar-color:rgba(168,85,247,0.2) transparent; }
    .ed-tabs::-webkit-scrollbar { width:3px; }
    .ed-tabs::-webkit-scrollbar-thumb { background:rgba(168,85,247,0.25); }
    .ed-tab { padding:0.55rem 0.7rem; font-size:0.55rem; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; border:none; border-left:2px solid transparent; color:rgba(160,140,200,0.4); background:transparent; transition:all 0.2s; text-align:left; font-family:'Cinzel',serif; line-height:1.4; word-break:break-word; }
    .ed-tab.active { color:#a855f7; border-left-color:#a855f7; background:rgba(168,85,247,0.07); }
    .ed-tab:hover:not(.active) { color:rgba(168,85,247,0.7); border-left-color:rgba(168,85,247,0.3); background:rgba(168,85,247,0.03); }
    .ed-body { flex:1; overflow-y:auto; padding:0.8rem 1rem 1.5rem; scrollbar-width:thin; scrollbar-color:rgba(168,85,247,0.3) transparent; min-width:0; }
    .ed-body::-webkit-scrollbar { width:4px; }
    .ed-body::-webkit-scrollbar-thumb { background:rgba(168,85,247,0.3); border-radius:2px; }
    .ed-section { margin-bottom:0.4rem; border:1px solid rgba(255,255,255,0.05); }
    .ed-section-head { padding:0.5rem 0.8rem; font-size:0.58rem; letter-spacing:0.25em; text-transform:uppercase; color:rgba(160,140,200,0.5); cursor:pointer; display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.02); user-select:none; font-family:'Cinzel',serif; }
    .ed-section-head .chev { transition:transform 0.25s; font-size:0.5rem; }
    .ed-section-head.collapsed .chev { transform:rotate(-90deg); }
    .ed-section-body { padding:0.6rem 0.8rem 0.8rem; display:flex; flex-direction:column; gap:0.5rem; }
    .ed-section-body.hidden { display:none; }
    .ed-row { display:flex; align-items:center; gap:0.5rem; }
    .ed-label { font-size:0.58rem; letter-spacing:0.12em; color:rgba(160,140,200,0.55); min-width:72px; text-transform:uppercase; font-family:'Cinzel',serif; }
    input[type=range] { flex:1; -webkit-appearance:none; height:2px; background:rgba(168,85,247,0.25); border-radius:1px; outline:none; cursor:pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#a855f7; cursor:pointer; }
    .ed-val { font-size:0.6rem; color:rgba(0,255,231,0.8); min-width:38px; text-align:right; font-family:'Cormorant Garamond',serif; }
    input[type=color] { width:28px; height:20px; border:1px solid rgba(255,255,255,0.1); background:none; cursor:pointer; padding:0; border-radius:2px; }
    .ed-toggle { display:flex; align-items:center; gap:0.5rem; cursor:pointer; }
    .ed-toggle input[type=checkbox] { display:none; }
    .tog-pill { width:30px; height:16px; border-radius:8px; background:rgba(255,255,255,0.1); position:relative; transition:background 0.25s; flex-shrink:0; }
    .tog-pill::after { content:''; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:#fff; transition:transform 0.25s; }
    input[type=checkbox]:checked ~ .tog-pill { background:rgba(168,85,247,0.7); }
    input[type=checkbox]:checked ~ .tog-pill::after { transform:translateX(14px); }
    .tog-label { font-size:0.58rem; letter-spacing:0.15em; color:rgba(160,140,200,0.55); text-transform:uppercase; font-family:'Cinzel',serif; }
    .grad-preview { height:20px; border-radius:2px; margin-bottom:0.4rem; border:1px solid rgba(255,255,255,0.07); }
    .color-stops { display:flex; flex-direction:column; gap:0.4rem; }
    .cstop-row { display:flex; align-items:center; gap:0.4rem; }
    select { background:rgba(4,4,14,0.9); border:1px solid rgba(168,85,247,0.25); color:rgba(200,190,230,0.8); font-family:'Cinzel',serif; font-size:0.58rem; padding:0.25rem 0.4rem; cursor:pointer; outline:none; flex:1; }
    select option { background:#0a0a1a; }
    .aura-colors { display:flex; flex-wrap:wrap; gap:0.4rem; margin-top:0.3rem; }
    .aura-color-item { display:flex; align-items:center; gap:0.2rem; }
    .fx-block { border:1px solid rgba(255,255,255,0.04); padding:0.5rem; margin-bottom:0.35rem; }
    .ed-footer { padding:0.8rem 1.2rem; border-top:1px solid rgba(168,85,247,0.15); display:flex; gap:0.5rem; flex-shrink:0; }
    .ed-btn { flex:1; padding:0.55rem; font-family:'Cinzel',serif; font-size:0.6rem; letter-spacing:0.2em; text-transform:uppercase; cursor:pointer; transition:all 0.2s; border:1px solid; }
    .ed-btn.primary { background:rgba(168,85,247,0.15); border-color:rgba(168,85,247,0.5); color:#a855f7; }
    .ed-btn.primary:hover { background:rgba(168,85,247,0.28); border-color:#a855f7; }
    .ed-btn.secondary { background:rgba(0,255,231,0.05); border-color:rgba(0,255,231,0.25); color:rgba(0,255,231,0.6); }
    .ed-btn.secondary:hover { background:rgba(0,255,231,0.12); border-color:#00ffe7; color:#00ffe7; }
    #toast { position:fixed; bottom:2rem; left:50%; transform:translateX(-50%) translateY(60px); background:rgba(0,255,231,0.12); border:1px solid rgba(0,255,231,0.3); color:#00ffe7; padding:0.5rem 1.4rem; font-size:0.65rem; letter-spacing:0.2em; z-index:200; transition:transform 0.3s,opacity 0.3s; opacity:0; pointer-events:none; font-family:'Cinzel',serif; }
    #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
    .ed-text-input { flex:1; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); color:#e0d8f0; padding:0.25rem 0.4rem; font-family:'Cinzel',serif; font-size:0.58rem; outline:none; }
    .ed-mini-btn { background:transparent; border:1px solid rgba(255,100,100,0.3); color:rgba(255,100,100,0.5); font-size:0.55rem; padding:0.1rem 0.35rem; cursor:pointer; transition:all 0.15s; line-height:1; }
    .ed-mini-btn:hover { border-color:rgba(255,100,100,0.8); color:rgba(255,120,120,0.9); background:rgba(255,60,60,0.08); }
    .ed-mini-del { margin-left:auto; }
    .ed-add-btn { width:100%; margin-top:0.4rem; padding:0.35rem; background:rgba(168,85,247,0.06); border:1px dashed rgba(168,85,247,0.3); color:rgba(168,85,247,0.6); font-family:'Cinzel',serif; font-size:0.55rem; letter-spacing:0.15em; text-transform:uppercase; cursor:pointer; transition:all 0.2s; }
    .ed-add-btn:hover { background:rgba(168,85,247,0.12); border-color:rgba(168,85,247,0.7); color:#a855f7; }
    .ed-auto-btn { width:100%; margin-bottom:0.6rem; padding:0.45rem; background:linear-gradient(135deg,rgba(0,255,200,0.08),rgba(168,85,247,0.08)); border:1px solid rgba(0,255,200,0.3); color:rgba(0,255,200,0.8); font-family:'Cinzel',serif; font-size:0.58rem; letter-spacing:0.2em; text-transform:uppercase; cursor:pointer; transition:all 0.2s; }
    .ed-auto-btn:hover { background:linear-gradient(135deg,rgba(0,255,200,0.15),rgba(168,85,247,0.15)); border-color:rgba(0,255,200,0.7); color:#00ffc8; }
    .cstop-row { display:flex; align-items:center; gap:0.4rem; }
  </style>
</head>
<body>
<div id="loading-bar"></div>
<canvas id="gradient-canvas"></canvas>
<div id="canvas-container"></div>
<div id="veil"></div>
<div id="hud">
  <div id="model-name">-</div>
  <div id="countdown"></div>
  <div class="corner-deco tl"></div><div class="corner-deco tr"></div>
  <div class="corner-deco bl"></div><div class="corner-deco br"></div>
</div>
<div id="hint">DRAG · PINCH TO ZOOM</div>
<div id="controls">
  <button class="ctrl-btn accent" onclick="randomModel()">Random</button>
  <button class="ctrl-btn" onclick="nextModel()">Next</button>
  <button class="ctrl-btn ed-tog" id="ed-btn" onclick="toggleEditor()">Editor</button>
</div>
<div id="error-banner"></div>
<div id="toast"></div>
<div id="editor">
  <div class="ed-header"><div class="ed-title">Aether Visual Editor</div></div>
  <div class="ed-mid">
    <div class="ed-tabs" id="ed-tabs"></div>
    <div class="ed-body" id="ed-body"></div>
  </div>
  <div class="ed-footer">
    <button class="ed-btn secondary" onclick="copyJSON()">⎘ Copy config.json</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script>
'use strict';
const W=()=>window.innerWidth,H=()=>window.innerHeight,DEG=Math.PI/180;
const gradCanvas=document.getElementById('gradient-canvas'),gradCtx=gradCanvas.getContext('2d');
let currentGradientCfg=null;
function resizeGC(){gradCanvas.width=W();gradCanvas.height=H();if(currentGradientCfg)drawGradient(currentGradientCfg);}
function drawGradient(cfg){
  currentGradientCfg=cfg;gradCanvas.width=W();gradCanvas.height=H();gradCtx.clearRect(0,0,W(),H());
  if(!cfg?.stops?.length || cfg.enabled === false) return;
  let grad;
  if(cfg.type==='radial'){const cx=W()*.5,cy=H()*.5,r=Math.max(W(),H())*.75;grad=gradCtx.createRadialGradient(cx,cy,0,cx,cy,r);}
  else{const a=(cfg.angle||135)*DEG,cx=W()/2,cy=H()/2,len=Math.sqrt(W()*W()+H()*H())/2;grad=gradCtx.createLinearGradient(cx-Math.cos(a)*len,cy-Math.sin(a)*len,cx+Math.cos(a)*len,cy+Math.sin(a)*len);}
  (cfg.stops||[]).forEach(s=>grad.addColorStop(s.position,s.color));
  gradCtx.fillStyle=grad;gradCtx.fillRect(0,0,W(),H());
}
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(W(),H());
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;renderer.setClearColor(0,0);
document.getElementById('canvas-container').appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(55,W()/H(),0.1,500);
camera.position.set(0,0,6);
const dracoLoader=new THREE.DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
const gltfLoader=new THREE.GLTFLoader();gltfLoader.setDRACOLoader(dracoLoader);
let config=null,currentIndex=0,modelGroup=null;
let currentEffects=null,currentAuraCfg=null,currentTransform=null,currentCursorTrack=null;
let mixer=null,mixerClips=[],currentAnimCfg=null;
let particleMeta=[],partGeo=null,partPoints=null,starPoints=null;
let petalMode=false,petalDummy=null;
let ambientLight=null,dynamicLights=[];
let timerInterval=null,nextTimer=0;
let isDragging=false,prevMouse={x:0,y:0},rotVel={x:0,y:0},dragRot={x:0,y:0};
let cursorRot={x:0,y:0},cursorTarget={x:0,y:0},mouseNorm={x:0,y:0};
const delay=ms=>new Promise(r=>setTimeout(r,ms));
function setBar(p){const b=document.getElementById('loading-bar');b.style.opacity=(p>0&&p<100)?'1':'0';b.style.width=p+'%';}
function showError(m){const e=document.getElementById('error-banner');e.style.display='block';e.innerHTML='ERROR: '+m;}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function buildLighting(lc){
  if(ambientLight)scene.remove(ambientLight);
  dynamicLights.forEach(l=>scene.remove(l.mesh));dynamicLights=[];
  ambientLight=new THREE.AmbientLight(new THREE.Color(lc.ambient_color),lc.ambient_intensity);scene.add(ambientLight);
  (lc.lights||[]).forEach(l=>{const pt=new THREE.PointLight(new THREE.Color(l.color),l.intensity,35);pt.position.set(...l.position);scene.add(pt);dynamicLights.push({mesh:pt,baseIntensity:l.intensity});});
}
function createPetalGeometry(){
  // Organic rose-petal shape built with bezier curves
  const shape=new THREE.Shape();
  shape.moveTo(0,-0.5);
  shape.bezierCurveTo( 0.38,-0.35, 0.5, 0.05, 0.22, 0.35);
  shape.bezierCurveTo( 0.1,  0.52, 0,   0.5,  0,    0.5);
  shape.bezierCurveTo(-0.1,  0.52,-0.1, 0.52,-0.22, 0.35);
  shape.bezierCurveTo(-0.5,  0.05,-0.38,-0.35, 0,   -0.5);
  return new THREE.ShapeGeometry(shape,10);
}
function buildParticles(ac){
  if(partPoints) scene.remove(partPoints);
  partGeo=null;
  const N=ac.particle_count;
  const palette=ac.colors.map(c=>new THREE.Color(c));
  particleMeta=[];
  petalMode = (ac.shape==='petal');

  if(petalMode){
    // ── InstancedMesh path — each petal tumbles individually ──
    const geo=createPetalGeometry();
    const mat=new THREE.MeshBasicMaterial({
      transparent:true, opacity:ac.particle_opacity,
      side:THREE.DoubleSide, depthWrite:false,
      blending:THREE.AdditiveBlending,
    });
    const mesh=new THREE.InstancedMesh(geo,mat,N);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    // per-instance colors
    const colArr=new Float32Array(N*3);
    for(let i=0;i<N;i++){
      const r=ac.swirl_radius_min+Math.random()*(ac.swirl_radius_max-ac.swirl_radius_min);
      const theta=Math.random()*Math.PI*2, phi=Math.acos(2*Math.random()-1);
      const flutter=ac.petal_flutter||1;
      particleMeta.push({
        r,phi,offset:theta,
        speed:(0.2+Math.random()*0.8)*ac.particle_speed,
        rx:Math.random()*Math.PI*2, ry:Math.random()*Math.PI*2, rz:Math.random()*Math.PI*2,
        rxSpeed:(Math.random()-0.5)*0.8*flutter,
        rySpeed:(Math.random()-0.5)*1.2*flutter,
        rzSpeed:(Math.random()-0.5)*0.5*flutter,
        wobble:Math.random()*Math.PI*2,
        wobbleSpeed:(0.5+Math.random())*flutter,
      });
      const c=palette[Math.floor(Math.random()*palette.length)];
      colArr[i*3]=c.r; colArr[i*3+1]=c.g; colArr[i*3+2]=c.b;
    }
    mesh.instanceColor=new THREE.InstancedBufferAttribute(colArr,3);
    if(!petalDummy) petalDummy=new THREE.Object3D();
    partPoints=mesh;
  } else {
    // ── Original Points path ──
    const positions=new Float32Array(N*3),colors=new Float32Array(N*3);
    for(let i=0;i<N;i++){
      const r=ac.swirl_radius_min+Math.random()*(ac.swirl_radius_max-ac.swirl_radius_min);
      const theta=Math.random()*Math.PI*2,phi=Math.acos(2*Math.random()-1);
      particleMeta.push({r,phi,offset:theta,speed:(0.2+Math.random()*0.8)*ac.particle_speed});
      positions[i*3]=r*Math.sin(phi)*Math.cos(theta);
      positions[i*3+1]=r*Math.sin(phi)*Math.sin(theta)*ac.swirl_y_squash;
      positions[i*3+2]=r*Math.cos(phi);
      const c=palette[Math.floor(Math.random()*palette.length)];
      colors[i*3]=c.r;colors[i*3+1]=c.g;colors[i*3+2]=c.b;
    }
    partGeo=new THREE.BufferGeometry();
    partGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));
    partGeo.setAttribute('color',new THREE.BufferAttribute(colors,3));
    partPoints=new THREE.Points(partGeo,new THREE.PointsMaterial({
      size:ac.particle_size,vertexColors:true,transparent:true,
      opacity:ac.particle_opacity,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true,
    }));
  }
  scene.add(partPoints);
}
function buildStars(sc){
  if(starPoints)scene.remove(starPoints);if(!sc?.enabled)return;
  const p=new Float32Array(sc.count*3);for(let i=0;i<p.length;i++)p[i]=(Math.random()-0.5)*200;
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
  starPoints=new THREE.Points(g,new THREE.PointsMaterial({size:sc.size,color:0xffffff,transparent:true,opacity:sc.opacity,blending:THREE.AdditiveBlending,depthWrite:false}));
  scene.add(starPoints);
}
function buildModelGroup(gltf,cfg){
  const group=new THREE.Group(),model=gltf.scene;
  const box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
  const maxDim=Math.max(size.x,size.y,size.z),autoScale=2.5/maxDim;
  model.position.sub(center);model.scale.setScalar(autoScale);

  // Effects

// ── Auto palette from model ───────────────

// Convert RGB (0-1) to HSL (h:0-360, s:0-1, l:0-1)
function rgbToHsl(r,g,b){
  const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;
  let h=0,s=0,l=(max+min)/2;
  if(d>0){
    s=d/(1-Math.abs(2*l-1));
    if(max===r) h=((g-b)/d+6)%6;
    else if(max===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60;
  }
  return{h,s,l};
}

// Convert HSL back to hex
function hslToHex(h,s,l){
  const a=s*Math.min(l,1-l);
  const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,'0');};
  return '#'+f(0)+f(8)+f(4);
}

function rgbToHex(r,g,b){
  const h=v=>Math.round(Math.max(0,Math.min(255,v*255))).toString(16).padStart(2,'0');
  return '#'+h(r)+h(g)+h(b);
}

function extractModelColors(group){
  const colors=[];
  if(!group) return colors;
  group.traverse(child=>{
    if(!child.isMesh||!child.material) return;
    const mats=Array.isArray(child.material)?child.material:[child.material];
    mats.forEach(mat=>{
      if(mat.color){const c=mat.color;colors.push({r:c.r,g:c.g,b:c.b});}
      // Sample texture at 32x32 — every 4th byte for speed
      if(mat.map&&mat.map.image){
        try{
          const img=mat.map.image,sz=32;
          const cv=document.createElement('canvas');cv.width=sz;cv.height=sz;
          cv.getContext('2d').drawImage(img,0,0,sz,sz);
          const px=cv.getContext('2d').getImageData(0,0,sz,sz).data;
          for(let i=0;i<px.length;i+=4){
            colors.push({r:px[i]/255,g:px[i+1]/255,b:px[i+2]/255});
          }
        }catch(e){}
      }
    });
  });
  return colors;
}

// Cluster by hue — divide hue wheel into k buckets,
// then pick the MOST SATURATED & LUMINOUS color from each bucket.
// This keeps vivid distinct hues instead of averaging toward grey.
function pickDistinctColors(colors,k=5){
  if(!colors.length) return [];

  // Convert all to HSL and filter out near-black, near-white, near-grey
  const hsl=colors.map(c=>({...rgbToHsl(c.r,c.g,c.b),r:c.r,g:c.g,b:c.b}))
    .filter(c=>c.s>0.12 && c.l>0.08 && c.l<0.92);

  // Fall back to all colors if none pass filter (e.g. all-grey model)
  const src=hsl.length>=k ? hsl : colors.map(c=>({...rgbToHsl(c.r,c.g,c.b),r:c.r,g:c.g,b:c.b}));
  if(!src.length) return [{r:0,g:0.9,b:0.8}];

  // Assign each color to a hue bucket
  const buckets=Array.from({length:k},()=>[]);
  src.forEach(c=>buckets[Math.floor(c.h/360*k)%k].push(c));

  // From each bucket pick the most saturated; if bucket empty, steal from largest
  const results=[];
  buckets.forEach((bucket,i)=>{
    if(!bucket.length) return;
    // Score = saturation * 0.7 + luminance_mid * 0.3 (prefer vivid, not too dark/light)
    bucket.sort((a,b)=>(b.s*0.7+((1-Math.abs(b.l-0.5)*2))*0.3)-(a.s*0.7+((1-Math.abs(a.l-0.5)*2))*0.3));
    results.push(bucket[0]);
  });

  // If some buckets were empty, fill from most-populated buckets (best leftovers)
  if(results.length<k){
    const extras=src.filter(c=>!results.includes(c));
    extras.sort((a,b)=>b.s-a.s);
    while(results.length<k&&extras.length) results.push(extras.shift());
  }

  return results.map(c=>({r:c.r,g:c.g,b:c.b}));
}

window.autoColors=function(idx){
  if(!modelGroup||!config) return;
  const cfg=config.objects[idx]; ensureDefaults(cfg);
  const rawColors=extractModelColors(modelGroup);
  const palette=pickDistinctColors(rawColors,5);
  if(!palette.length){toast('No colors found in model');return;}

  // Sort by hue for a pleasant gradient sweep
  const withHsl=palette.map(c=>({...c,...rgbToHsl(c.r,c.g,c.b)}));
  withHsl.sort((a,b)=>a.h-b.h);

  // Gradient: darken to 20-30% brightness so it's a background, not a rainbow
  // Use HSL so hue is perfectly preserved while lightness is clamped
  cfg.gradient.enabled=true;
  cfg.gradient.stops=withHsl.map((c,i)=>{
    const t=i/(withHsl.length-1);
    // Keep full hue+sat, lightness 25-40% — dark enough for background, vivid enough to feel colored
    const l=0.25+t*0.15;
    return {color:hslToHex(c.h, Math.min(c.s,1), l), position:t};
  });
  drawGradient(cfg.gradient);

  // Lights: use vivid versions (full saturation, mid lightness ~50%)
  const lightPositions=[[4,3,4],[-4,-2,3],[0,-4,-3],[-3,4,-2],[2,-3,2]];
  cfg.lighting.lights=withHsl.map((c,i)=>({
    color: hslToHex(c.h, Math.min(c.s+0.2,1), 0.5),
    intensity: 4+Math.random()*4,
    position: lightPositions[i%lightPositions.length]
  }));
  buildLighting(cfg.lighting);

  // Aura: vivid full-brightness versions
  cfg.aura.colors=withHsl.map(c=>hslToHex(c.h, Math.min(c.s+0.15,1), 0.6));
  buildParticles(cfg.aura);
  updateHud(cfg);

  buildObjectEditor(idx);
  toast('Auto colors applied!');
};


function serializeConfig(obj){
  // Pretty-print with 2-space indent, but collapse arrays of primitives onto one line
  const raw=JSON.stringify(obj,null,2);
  return raw.replace(/\[(\s*(?:"[^"]*"|[\d.eE+\-]+)(?:,\s*(?:"[^"]*"|[\d.eE+\-]+))*\s*)\]/gs,
    (_,inner)=>'['+inner.trim().replace(/\s*\n\s*/g,'').replace(/,\s+/g,', ')+']');
}
window.copyJSON=()=>{navigator.clipboard.writeText(serializeConfig(config)).then(()=>toast('Copied to clipboard!'));};
async function boot(){
  resizeGC();animate();
  try{
    const res=await fetch('config.json');if(!res.ok)throw new Error('HTTP '+res.status);
    config=await res.json();if(!config.objects?.length)throw new Error('No objects in config.json');
    await activateObject(0);resetTimer();
  }catch(err){showError(err.message+' - Run: python -m http.server 8080');}
}
boot();
