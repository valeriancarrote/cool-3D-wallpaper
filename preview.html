<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether Wallpaper</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#030308; font-family:'Cinzel',serif; color:#e0d8f0; }

    /* Gradient canvas sits behind the 3D canvas */
    #gradient-canvas { position:fixed; inset:0; z-index:0; }
    #canvas-container { position:fixed; inset:0; z-index:1; }
    canvas { display:block; }

    #veil { position:fixed; inset:0; z-index:5; background:#000; opacity:0; pointer-events:none; transition:opacity 0.8s ease; }
    #veil.on { opacity:1; }

    #loading-bar {
      position:fixed; top:0; left:0; height:2px;
      background:linear-gradient(90deg,#00ffe7,#a855f7);
      width:0%; z-index:100; transition:width 0.4s ease; opacity:0;
    }

    #hud { position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity 1s ease; z-index:10; }
    #hud.visible { opacity:1; }
    #model-name {
      position:fixed; bottom:2.5rem; left:50%; transform:translateX(-50%);
      font-size:clamp(1rem,3vw,2rem); font-weight:700; letter-spacing:0.4em; text-transform:uppercase;
      background:linear-gradient(135deg,#00ffe7,#a855f7);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    #countdown {
      position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%);
      font-family:'Cormorant Garamond',serif; font-style:italic; font-size:0.7rem;
      letter-spacing:0.35em; color:rgba(160,140,200,0.35);
    }
    .corner-deco { position:fixed; width:70px; height:70px; pointer-events:none; opacity:0.3; z-index:10; }
    .corner-deco::before,.corner-deco::after { content:''; position:absolute; background:var(--accent,#00ffe7); }
    .corner-deco::before { width:2px; height:35px; }
    .corner-deco::after  { width:35px; height:2px; }
    .corner-deco.tl { top:20px; left:20px; }
    .corner-deco.tr { top:20px; right:20px; transform:scaleX(-1); }
    .corner-deco.bl { bottom:20px; left:20px; transform:scaleY(-1); }
    .corner-deco.br { bottom:20px; right:20px; transform:scale(-1); }

    #controls {
      position:fixed; top:1.2rem; right:1.2rem;
      display:flex; gap:0.5rem; z-index:20;
    }
    .ctrl-btn {
      padding:0.4rem 0.9rem;
      background:rgba(3,3,8,0.75); backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.1); color:rgba(200,190,230,0.6);
      font-family:'Cinzel',serif; font-size:0.6rem; letter-spacing:0.2em; text-transform:uppercase;
      cursor:pointer; transition:all 0.2s; white-space:nowrap; user-select:none;
    }
    .ctrl-btn:hover { border-color:rgba(0,255,231,0.5); color:#00ffe7; background:rgba(0,255,231,0.06); }
    .ctrl-btn.accent { border-color:rgba(0,255,231,0.3); color:rgba(0,255,231,0.75); }
    .ctrl-btn.accent:hover { background:rgba(0,255,231,0.1); }

    #hint {
      position:fixed; top:1.2rem; left:1.2rem;
      font-family:'Cormorant Garamond',serif; font-style:italic;
      font-size:0.65rem; letter-spacing:0.3em; color:rgba(160,140,200,0.2);
      pointer-events:none; z-index:20;
    }

    #error-banner {
      position:fixed; top:1rem; left:50%; transform:translateX(-50%);
      background:rgba(255,60,60,0.12); border:1px solid rgba(255,60,60,0.35);
      color:rgba(255,160,160,0.9); padding:0.6rem 1.4rem;
      font-size:0.68rem; letter-spacing:0.18em; display:none; z-index:100;
      max-width:90vw; text-align:center; line-height:1.6;
    }
  </style>
</head>
<body>

<div id="loading-bar"></div>
<canvas id="gradient-canvas"></canvas>
<div id="canvas-container"></div>
<div id="veil"></div>

<div id="hud">
  <div id="model-name">—</div>
  <div id="countdown"></div>
  <div class="corner-deco tl"></div>
  <div class="corner-deco tr"></div>
  <div class="corner-deco bl"></div>
  <div class="corner-deco br"></div>
</div>

<div id="hint">DRAG · SCROLL</div>

<div id="controls">
  <button class="ctrl-btn accent" onclick="randomModel()">⚄ Random</button>
  <button class="ctrl-btn"        onclick="nextModel()">→ Next</button>
</div>

<div id="error-banner"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script>
'use strict';

const W = ()=>window.innerWidth, H = ()=>window.innerHeight;
const DEG = Math.PI / 180;

// ── Gradient canvas ────────────────────────────────────────────
const gradCanvas = document.getElementById('gradient-canvas');
const gradCtx    = gradCanvas.getContext('2d');
let   currentGradientCfg = null;

function resizeGradientCanvas() {
  gradCanvas.width  = W();
  gradCanvas.height = H();
  if (currentGradientCfg) drawGradient(currentGradientCfg);
}

function drawGradient(cfg) {
  currentGradientCfg = cfg;
  gradCanvas.width  = W();
  gradCanvas.height = H();
  gradCtx.clearRect(0, 0, W(), H());

  if (!cfg?.enabled) return;

  let grad;
  if (cfg.type === 'radial') {
    const cx = W() * 0.5, cy = H() * 0.5;
    const r  = Math.max(W(), H()) * 0.75;
    grad = gradCtx.createRadialGradient(cx, cy, 0, cx, cy, r);
  } else {
    // linear — angle in degrees
    const angle = ((cfg.angle || 135) * DEG);
    const cx = W() / 2, cy = H() / 2;
    const len = Math.sqrt(W()*W() + H()*H()) / 2;
    grad = gradCtx.createLinearGradient(
      cx - Math.cos(angle) * len, cy - Math.sin(angle) * len,
      cx + Math.cos(angle) * len, cy + Math.sin(angle) * len
    );
  }

  (cfg.stops || []).forEach(s => grad.addColorStop(s.position, s.color));
  gradCtx.fillStyle = grad;
  gradCtx.fillRect(0, 0, W(), H());
}

function animateGradientTransition(fromCfg, toCfg, durationMs) {
  // Animate opacity of the new gradient fading in over a 2D canvas
  // We just redraw at toCfg immediately since the veil handles the visual transition
  drawGradient(toCfg);
}

window.addEventListener('resize', resizeGradientCanvas);

// ── Three.js renderer (alpha:true so gradient shows through) ──
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W(), H());
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.setClearColor(0x000000, 0); // fully transparent — gradient canvas shows through
document.getElementById('canvas-container').appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, W()/H(), 0.1, 500);
camera.position.set(0, 0, 6);

const dracoLoader = new THREE.DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
const gltfLoader = new THREE.GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

// ── Scene state ────────────────────────────────────────────────
let config         = null;
let currentIndex   = 0;
let modelGroup     = null;
let currentEffects = null;
let currentAuraCfg = null;
let currentTransform   = null;
let currentCursorTrack = null;
let particleMeta   = [];
let partGeo = null, partPoints = null, starPoints = null;
let ambientLight = null, dynamicLights = [];
let timerInterval = null, nextTimer = 0;

// Rotation state — base + drag + cursor
let isDragging = false, prevMouse = {x:0,y:0};
let rotVel     = {x:0, y:0};
let dragRot    = {x:0, y:0};   // accumulated drag rotation
let cursorRot  = {x:0, y:0};   // current smoothed cursor tilt
let cursorTarget = {x:0, y:0}; // raw cursor tilt target
let mouseNorm  = {x:0, y:0};   // -1..1 normalised mouse

window.addEventListener('mousemove', e => {
  mouseNorm.x =  (e.clientX / W()) * 2 - 1;
  mouseNorm.y = -((e.clientY / H()) * 2 - 1);
});

// ── Helpers ────────────────────────────────────────────────────
const delay = ms => new Promise(r => setTimeout(r, ms));
function setBar(pct) {
  const b = document.getElementById('loading-bar');
  b.style.opacity = (pct > 0 && pct < 100) ? '1' : '0';
  b.style.width   = pct + '%';
}
function showError(msg) {
  const el = document.getElementById('error-banner');
  el.style.display = 'block';
  el.innerHTML = '⚠ ' + msg;
}

// ── Lighting ───────────────────────────────────────────────────
function buildLighting(lc) {
  if (ambientLight) scene.remove(ambientLight);
  dynamicLights.forEach(l => scene.remove(l.mesh));
  dynamicLights = [];
  ambientLight = new THREE.AmbientLight(new THREE.Color(lc.ambient_color), lc.ambient_intensity);
  scene.add(ambientLight);
  (lc.lights || []).forEach(l => {
    const pt = new THREE.PointLight(new THREE.Color(l.color), l.intensity, 35);
    pt.position.set(...l.position);
    scene.add(pt);
    dynamicLights.push({ mesh: pt, baseIntensity: l.intensity });
  });
}

// ── Particles ──────────────────────────────────────────────────
function buildParticles(ac) {
  if (partPoints) scene.remove(partPoints);
  const N = ac.particle_count;
  const positions = new Float32Array(N * 3);
  const colors    = new Float32Array(N * 3);
  particleMeta = [];
  const palette = ac.colors.map(c => new THREE.Color(c));
  for (let i = 0; i < N; i++) {
    const r     = ac.swirl_radius_min + Math.random()*(ac.swirl_radius_max-ac.swirl_radius_min);
    const theta = Math.random()*Math.PI*2, phi = Math.acos(2*Math.random()-1);
    particleMeta.push({ r, phi, offset:theta, speed:(0.2+Math.random()*0.8)*ac.particle_speed });
    positions[i*3]   = r*Math.sin(phi)*Math.cos(theta);
    positions[i*3+1] = r*Math.sin(phi)*Math.sin(theta)*ac.swirl_y_squash;
    positions[i*3+2] = r*Math.cos(phi);
    const c = palette[Math.floor(Math.random()*palette.length)];
    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
  }
  partGeo = new THREE.BufferGeometry();
  partGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  partGeo.setAttribute('color',    new THREE.BufferAttribute(colors,3));
  partPoints = new THREE.Points(partGeo, new THREE.PointsMaterial({
    size:ac.particle_size, vertexColors:true, transparent:true,
    opacity:ac.particle_opacity, blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true,
  }));
  scene.add(partPoints);
}

// ── Stars ──────────────────────────────────────────────────────
function buildStars(sc) {
  if (starPoints) scene.remove(starPoints);
  if (!sc?.enabled) return;
  const p = new Float32Array(sc.count*3);
  for (let i=0;i<p.length;i++) p[i]=(Math.random()-0.5)*200;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p,3));
  starPoints = new THREE.Points(g, new THREE.PointsMaterial({
    size:sc.size, color:0xffffff, transparent:true, opacity:sc.opacity,
    blending:THREE.AdditiveBlending, depthWrite:false,
  }));
  scene.add(starPoints);
}

// ── Model group ────────────────────────────────────────────────
function buildModelGroup(gltfScene, cfg) {
  const group = new THREE.Group();
  const model = gltfScene;
  const box    = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size   = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale  = 2.5 / maxDim;
  model.position.sub(center);
  model.scale.setScalar(scale);
  const fx = cfg.effects;

  if (fx.emissive_glow?.enabled) {
    model.traverse(child => {
      if (child.isMesh && child.material) {
        const mats = Array.isArray(child.material)?child.material:[child.material];
        mats.forEach(m => {
          if (m.isMeshStandardMaterial||m.isMeshPhysicalMaterial) {
            m.emissive = new THREE.Color(fx.emissive_glow.color);
            m.emissiveIntensity = fx.emissive_glow.intensity;
          }
        });
      }
    });
  }

  if (fx.wireframe_shell?.enabled) {
    const ws = box.getSize(new THREE.Vector3()).multiplyScalar(scale*1.15);
    group.add(new THREE.Mesh(
      new THREE.BoxGeometry(ws.x,ws.y,ws.z),
      new THREE.MeshBasicMaterial({color:new THREE.Color(fx.wireframe_shell.color),wireframe:true,transparent:true,opacity:fx.wireframe_shell.opacity})
    ));
  }

  group._rings = [];
  if (fx.rings?.enabled) {
    const rc = fx.rings.colors||['#00ffe7','#a855f7','#f0c060'];
    const n  = Math.min(fx.rings.count||3, rc.length);
    const br = maxDim*scale*0.7;
    for (let i=0;i<n;i++) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(br+0.3+i*0.22,0.012,8,80),
        new THREE.MeshBasicMaterial({color:new THREE.Color(rc[i]),transparent:true,opacity:fx.rings.base_opacity})
      );
      ring.rotation.x=(Math.PI/3)*i; ring.rotation.y=(Math.PI/5)*i;
      group.add(ring); group._rings.push(ring);
    }
  }

  group.add(model);
  return group;
}

// ── Apply transform from config ────────────────────────────────
function applyBaseTransform(group, transform) {
  if (!transform) return;
  group.position.set(
    transform.position?.x || 0,
    transform.position?.y || 0,
    transform.position?.z || 0
  );
  // Store base rotation in radians, will be applied in animation loop
  group._baseRot = {
    x: (transform.rotation?.x || 0) * DEG,
    y: (transform.rotation?.y || 0) * DEG,
    z: (transform.rotation?.z || 0) * DEG,
  };
}

// ── HUD ────────────────────────────────────────────────────────
function updateHud(cfg) {
  const el = document.getElementById('model-name');
  el.textContent = cfg.name || '';
  const c1 = cfg.aura.colors[0]||'#00ffe7', c2 = cfg.aura.colors[1]||'#a855f7';
  el.style.backgroundImage = `linear-gradient(135deg,${c1},${c2})`;
  document.querySelectorAll('.corner-deco').forEach(d => d.style.setProperty('--accent',c1));
}

// ── Activate ───────────────────────────────────────────────────
async function activateObject(index) {
  const cfg = config.objects[index];

  document.getElementById('veil').classList.add('on');
  await delay(850);

  if (modelGroup) { scene.remove(modelGroup); modelGroup = null; }

  // Gradient
  drawGradient(cfg.gradient || { enabled: false });

  scene.fog = cfg.effects.fog?.enabled
    ? new THREE.FogExp2(new THREE.Color(cfg.effects.fog.color), cfg.effects.fog.density)
    : null;

  buildLighting(cfg.lighting);
  buildStars(cfg.effects.stars || {enabled:true,count:1200,opacity:0.4,size:0.06});
  currentAuraCfg   = cfg.aura;   buildParticles(cfg.aura);
  currentEffects   = cfg.effects;
  currentTransform = cfg.transform || null;
  currentCursorTrack = cfg.cursor_tracking || { enabled: false };

  camera.fov = config.camera_fov || 55;
  camera.position.z = config.camera_distance || 6;
  camera.updateProjectionMatrix();

  // Reset rotation to base
  dragRot    = {x:0, y:0};
  rotVel     = {x:0, y:0};
  cursorRot  = {x:0, y:0};
  cursorTarget = {x:0, y:0};

  setBar(30);
  try {
    modelGroup = await new Promise((res, rej) =>
      gltfLoader.load(cfg.file, gltf => res(buildModelGroup(gltf.scene, cfg)),
        xhr => { if (xhr.total) setBar(30+(xhr.loaded/xhr.total)*60); }, rej)
    );
    applyBaseTransform(modelGroup, currentTransform);
    scene.add(modelGroup);
    setBar(100); setTimeout(()=>setBar(0), 400);
    updateHud(cfg);
    if (config.show_hud !== false) document.getElementById('hud').classList.add('visible');
  } catch(err) {
    setBar(0);
    showError(`Could not load "${cfg.file}" — check the path in config.json`);
  }

  document.getElementById('veil').classList.remove('on');
}

// ── Timer ──────────────────────────────────────────────────────
function resetTimer() {
  if (timerInterval) clearInterval(timerInterval);
  nextTimer = config.transition_interval || 600;
  timerInterval = setInterval(()=>{
    nextTimer--;
    if (config.show_countdown !== false) {
      const m = String(Math.floor(nextTimer/60)).padStart(2,'0');
      const s = String(nextTimer%60).padStart(2,'0');
      document.getElementById('countdown').textContent = `next in ${m}:${s}`;
    }
    if (nextTimer <= 0) {
      currentIndex = (currentIndex+1) % config.objects.length;
      activateObject(currentIndex);
      nextTimer = config.transition_interval || 600;
    }
  }, 1000);
}

window.nextModel = ()=>{
  currentIndex = (currentIndex+1) % config.objects.length;
  resetTimer(); activateObject(currentIndex);
};
window.randomModel = ()=>{
  if (config.objects.length <= 1) return;
  let idx; do { idx=Math.floor(Math.random()*config.objects.length); } while(idx===currentIndex);
  currentIndex=idx; resetTimer(); activateObject(currentIndex);
};

// ── Input ──────────────────────────────────────────────────────
const rc = renderer.domElement;
rc.addEventListener('mousedown',  e => { isDragging=true; prevMouse={x:e.clientX,y:e.clientY}; });
window.addEventListener('mouseup',   ()=> isDragging=false);
window.addEventListener('mousemove', e => {
  mouseNorm.x =  (e.clientX/W())*2-1;
  mouseNorm.y = -((e.clientY/H())*2-1);
  if (!isDragging||!modelGroup) return;
  rotVel.y = (e.clientX-prevMouse.x)*0.008;
  rotVel.x = (e.clientY-prevMouse.y)*0.008;
  prevMouse = {x:e.clientX, y:e.clientY};
});
rc.addEventListener('touchstart', e=>{ isDragging=true; prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY}; });
window.addEventListener('touchend',  ()=>isDragging=false);
window.addEventListener('touchmove', e=>{
  mouseNorm.x = (e.touches[0].clientX/W())*2-1;
  mouseNorm.y = -((e.touches[0].clientY/H())*2-1);
  if (!isDragging||!modelGroup) return;
  rotVel.y=(e.touches[0].clientX-prevMouse.x)*0.008;
  rotVel.x=(e.touches[0].clientY-prevMouse.y)*0.008;
  prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};
});
window.addEventListener('wheel', e=>{
  camera.position.z=Math.max(2,Math.min(16,camera.position.z+e.deltaY*0.01));
});
window.addEventListener('resize', ()=>{
  camera.aspect=W()/H(); camera.updateProjectionMatrix(); renderer.setSize(W(),H());
  resizeGradientCanvas();
});

// ── Animation loop ─────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t  = clock.getElapsedTime();
  const fx = currentEffects;

  if (modelGroup && fx) {
    const baseRot = modelGroup._baseRot || {x:0,y:0,z:0};
    const tr      = currentTransform;
    const ct      = currentCursorTrack;

    // ── Bob
    const bobY = fx.bob?.enabled ? Math.sin(t*fx.bob.speed)*fx.bob.amplitude : 0;
    modelGroup.position.y = (tr?.position?.y||0) + bobY;

    // ── Pulse scale
    if (fx.pulse_scale?.enabled) {
      const s = 1 + Math.sin(t*fx.pulse_scale.speed)*fx.pulse_scale.amplitude;
      modelGroup.scale.setScalar(s);
    }

    // ── Drag accumulation
    if (!isDragging) { rotVel.x*=0.94; rotVel.y*=0.94; }
    dragRot.x += rotVel.x; dragRot.y += rotVel.y;

    // ── Auto-rotate (added on top of drag)
    if (!isDragging && fx.auto_rotate?.enabled) {
      dragRot.y += fx.auto_rotate.speed_y||0;
      dragRot.x += fx.auto_rotate.speed_x||0;
    }

    // ── Cursor tracking
    if (ct?.enabled) {
      const str = ct.strength || 0.3;
      cursorTarget.x = -mouseNorm.y * str;
      cursorTarget.y =  mouseNorm.x * str;
      const sm = ct.smoothing || 0.05;
      cursorRot.x += (cursorTarget.x - cursorRot.x) * sm;
      cursorRot.y += (cursorTarget.y - cursorRot.y) * sm;
    } else {
      cursorRot.x *= 0.95; cursorRot.y *= 0.95;
    }

    // ── Final rotation = base + drag + cursor
    modelGroup.rotation.x = baseRot.x + dragRot.x + cursorRot.x;
    modelGroup.rotation.y = baseRot.y + dragRot.y + cursorRot.y;
    modelGroup.rotation.z = baseRot.z;

    // ── Rings
    if (fx.rings?.enabled && modelGroup._rings) {
      const sp = fx.rings.spin_speed||0.3;
      modelGroup._rings.forEach((r,i)=>{
        r.rotation.z = t*(sp+i*0.12);
        r.rotation.x = Math.sin(t*0.2+i)*0.5+(Math.PI/3)*i;
        r.material.opacity = fx.rings.base_opacity*(0.5+Math.sin(t*1.5+i)*0.4);
      });
    }
  }

  // ── Particles
  if (partGeo && currentAuraCfg && particleMeta.length) {
    const pos = partGeo.attributes.position.array;
    const ys  = currentAuraCfg.swirl_y_squash;
    for (let i=0;i<particleMeta.length;i++) {
      const m = particleMeta[i];
      const angle = m.offset+t*m.speed*0.15;
      const r     = m.r+Math.sin(t*m.speed*0.5+m.offset)*0.3;
      const phi   = m.phi+Math.sin(t*0.1+m.offset)*0.05;
      pos[i*3]   = r*Math.sin(phi)*Math.cos(angle);
      pos[i*3+1] = r*Math.sin(phi)*Math.sin(angle)*ys;
      pos[i*3+2] = r*Math.cos(phi);
    }
    partGeo.attributes.position.needsUpdate = true;
    partPoints.rotation.y = t*0.018;
  }

  dynamicLights.forEach((l,i)=>{
    l.mesh.intensity=l.baseIntensity+Math.sin(t*(1.5+i*0.4)+i)*(l.baseIntensity*0.3);
  });

  renderer.render(scene, camera);
}

// ── Boot ───────────────────────────────────────────────────────
async function boot() {
  resizeGradientCanvas();
  animate();
  try {
    const res = await fetch('config.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    config = await res.json();
    if (!config.objects?.length) throw new Error('No objects defined in config.json');
    await activateObject(0);
    resetTimer();
  } catch(err) {
    showError(`${err.message}<br>Make sure you started the server: <b>python -m http.server 8080</b>`);
  }
}
